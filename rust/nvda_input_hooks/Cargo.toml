[package]
name = "nvda_input_hooks"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
# No tests — the crate's extern "C" deps (registerWindowsHook,
# nvdaControllerInternal_*, isTSFThread) are only resolved at nvdaHelperRemote.dll
# link time, so a standalone test binary cannot link.
test = false

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
]
