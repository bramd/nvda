[package]
name = "nvda_mshtml"
version = "0.1.0"
edition = "2021"

[lib]
# `staticlib` so nvdaHelperRemote.dll can link the C-ABI shims (added when
# the backend adapter lands in a later stage). `rlib` so the unit tests in
# this crate can build a test binary. Like nvda_acrobat, this crate is
# force-linked into nvda_ia2.lib (the single aggregate Rust staticlib) so
# nvda_vbuf's `#[no_mangle]` symbols aren't duplicated across archives.
crate-type = ["staticlib", "rlib"]

[features]
# `test_stubs` provides a Rust definition of the
# `nvdaControllerInternal_reportLiveRegion` extern (see
# `src/test_stubs.rs`) so downstream crates' test binaries can link
# without `nvdaControllerInternal_C.obj`. Downstream crates enable this
# only in `[dev-dependencies]`; the shipped staticlib never sees it. This
# crate's own tests pick the stub up via `cfg(test)`.
test_stubs = []

[dependencies.nvda_vbuf]
path = "../nvda_vbuf"

# Same path-dep with the `test_stubs` feature so `cargo test --lib` here
# can link without the C++ vbuf shim present. Resolver = "2" keeps it
# scoped to test/bench builds; the shipped staticlib never sees the stubs.
[dev-dependencies.nvda_vbuf]
path = "../nvda_vbuf"
features = ["test_stubs"]

[dependencies.windows-core]
version = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]
