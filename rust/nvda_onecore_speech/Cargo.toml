[package]
name = "nvda_onecore_speech"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib`: this crate is now a pure-Rust dependency of `nvda_python`, which
# exposes it to Python via PyO3 (nvdaRust.onecore). It used to be a `staticlib`
# linked into nvdaHelperLocalWin10.dll via a C ABI (ocSpeech_*), driven from
# oneCore.py by ctypes; that seam was replaced by the PyO3 wrapper.
crate-type = ["rlib"]

[dependencies.windows-core]
version = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Metadata",     # ApiInformation (feature gates)
    "Media_SpeechSynthesis",   # also pulls in Media::IMediaMarker
    "Storage_Streams",         # Buffer / IBuffer / InputStreamOptions
    "Win32_System_WinRT",      # IBufferByteAccess
    "Win32_Foundation",
]
