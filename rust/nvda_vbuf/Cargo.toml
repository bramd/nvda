[package]
name = "nvda_vbuf"
version = "0.1.0"
edition = "2021"

[lib]
# rlib only -- consumed by other Rust crates (nvda_ia2, future nvda_*
# vbuf backends). The extern "C" symbols this binds are defined by
# nvdaHelper/vbufBase/c_shim.cpp and reach the final DLL through
# whichever Rust crate links the consumer.
crate-type = ["rlib"]

[features]
# `test_stubs` provides Rust definitions of every `vbuf_backend_*`
# extern "C" symbol that just panic when called. The real symbols live
# in the C++
# shim (`nvdaHelper/vbufBase/c_shim.cpp`), so a stand-alone Rust test
# binary in a downstream crate can't link without them. Downstream
# crates enable this feature only in `[dev-dependencies]`, which under
# `resolver = "2"` activates the stubs solely for their `cargo test`
# build and never for the staticlib that links into nvdaHelperRemote.
test_stubs = []

# slotmap provides generational arena indices: NodeKey is a 64-bit
# value where the upper bits are a generation counter, so a stale key
# referring to a slot that has been reused yields None on lookup
# rather than aliasing into a different node. The vbufBase port uses
# this for the storage tree where the C++ original used raw pointers.
[dependencies.slotmap]
version = "1.0"
default-features = false  # we don't need serde or unstable

# regex backs `Buffer::find_node_by_attributes`, mirroring the C++
# `std::wregex` used by `VBufStorage_buffer_t::findNodeByAttributes`.
# The production patterns generated by
# `source/virtualBuffers/__init__.py::_prepareForFindByAttributes`
# use only alternation, non-capturing groups, character classes,
# quantifiers, and `\b` word boundaries -- no backreferences or
# lookaround -- so the standard `regex` crate (not `fancy-regex`)
# suffices. Default features give us the Unicode `\b` needed for the
# word-match patterns.
[dependencies.regex]
version = "1"
