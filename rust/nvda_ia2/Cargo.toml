[package]
name = "nvda_ia2"
version = "0.1.0"
edition = "2021"

[lib]
# `staticlib` so nvdaHelperRemote.dll can link the C-ABI shims.
# `rlib` so the unit tests in this crate can build a test binary.
crate-type = ["staticlib", "rlib"]

# ON by default as of the Phase 6e flip (Stage D). The production scons
# build runs `cargo build --release --package nvda_ia2` with NO
# `--features` flags, so the flip has to ride the default feature set:
# with `direct_rust_storage` in `default`, the shipped staticlib renders
# gecko into, and reads out of, the Rust `storage::Buffer`.
# `direct_rust_storage` forwards to nvda_vbuf's feature of the same name
# so the Rust-backed newtypes and this crate's own cfg-gated code (the
# gecko update orchestration and `FillVBufCtx.main`) switch on coherently
# as one unit. The feature-OFF build (the revert config) is reached with
# `--no-default-features`.
[features]
default = ["direct_rust_storage"]
direct_rust_storage = ["nvda_vbuf/direct_rust_storage"]

[dependencies.nvda_vbuf]
path = "../nvda_vbuf"

# Same path-dep, but with the `test_stubs` feature so `cargo test
# --lib` here can link without the C++ vbuf shim being present.
# Resolver = "2" keeps the feature scoped to test/bench builds, so the
# staticlib that links into nvdaHelperRemote.dll never sees the stubs.
[dev-dependencies.nvda_vbuf]
path = "../nvda_vbuf"
features = ["test_stubs"]

[dependencies.windows-core]
version = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]
