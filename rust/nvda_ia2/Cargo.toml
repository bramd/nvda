[package]
name = "nvda_ia2"
version = "0.1.0"
edition = "2021"

[lib]
# `staticlib` so nvdaHelperRemote.dll can link the C-ABI shims.
# `rlib` so the unit tests in this crate can build a test binary.
crate-type = ["staticlib", "rlib"]

# Rust storage is the only gecko vbuf path as of Phase 6e Stage E: the
# transitional storage-selection feature was removed and its Rust-backed
# code made unconditional. The production scons build runs
# `cargo build --release --package nvda_ia2` with NO `--features` flags
# and the shipped staticlib renders gecko into, and reads out of, the
# Rust `storage::Buffer`. Rolling back to the C++ `VBufStorage_buffer_t`
# is now a `git revert` of the Stage E commit plus the Stage D flip
# commit (9cd359fd0), not a feature toggle.

[dependencies.nvda_vbuf]
path = "../nvda_vbuf"

# nvda_ia2.lib is the single aggregate Rust vbuf-backend staticlib the
# DLL links (nvdaHelper/remote/sconscript). It force-includes the sibling
# backends here so their C-ABI symbols (acrobat_backend_*) land in this
# one archive. Linking each backend as its own staticlib instead would
# duplicate nvda_vbuf's `#[no_mangle]` extern_api symbols
# (nvda_vbuf_buffer_*) across archives -> multiply-defined-symbol link
# errors. A single staticlib bundles nvda_vbuf exactly once.
[dependencies.nvda_acrobat]
path = "../nvda_acrobat"

# Same path-dep, but with the `test_stubs` feature so `cargo test
# --lib` here can link without the C++ vbuf shim being present.
# Resolver = "2" keeps the feature scoped to test/bench builds, so the
# staticlib that links into nvdaHelperRemote.dll never sees the stubs.
[dev-dependencies.nvda_vbuf]
path = "../nvda_vbuf"
features = ["test_stubs"]

[dependencies.windows-core]
version = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]
