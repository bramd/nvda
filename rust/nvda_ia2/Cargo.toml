[package]
name = "nvda_ia2"
version = "0.1.0"
edition = "2021"

[lib]
# `staticlib` so nvdaHelperRemote.dll can link the C-ABI shims.
# `rlib` so the unit tests in this crate can build a test binary.
crate-type = ["staticlib", "rlib"]

[features]
# Off by default -- nvda_ia2 ships feature-OFF, rendering through the
# C-shim into the C++ VBufStorage_buffer_t. Enabling it (the Phase 6e
# flip, Stage D) forwards to nvda_vbuf's `direct_rust_storage` so the
# Rust-backed newtypes and this crate's own cfg-gated code (the gecko
# update orchestration and `FillVBufCtx.main`) switch on coherently as
# one unit. Declared now (Stage B) so those cfg-gates are meaningful;
# not added to any default or dependency `features` list, so the shipped
# feature-off build is unaffected.
direct_rust_storage = ["nvda_vbuf/direct_rust_storage"]

[dependencies.nvda_vbuf]
path = "../nvda_vbuf"

# Same path-dep, but with the `test_stubs` feature so `cargo test
# --lib` here can link without the C++ vbuf shim being present.
# Resolver = "2" keeps the feature scoped to test/bench builds, so the
# staticlib that links into nvdaHelperRemote.dll never sees the stubs.
[dev-dependencies.nvda_vbuf]
path = "../nvda_vbuf"
features = ["test_stubs"]

[dependencies.windows-core]
version = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]
