[package]
name = "nvda_ia2"
version = "0.1.0"
edition = "2021"

[lib]
# `staticlib` so nvdaHelperRemote.dll can link the C-ABI shims.
# `rlib` so the unit tests in this crate can build a test binary.
crate-type = ["staticlib", "rlib"]

[dependencies.nvda_vbuf]
path = "../nvda_vbuf"

# Same path-dep, but with the `test_stubs` feature so `cargo test
# --lib` here can link without the C++ vbuf shim being present.
# Resolver = "2" keeps the feature scoped to test/bench builds, so the
# staticlib that links into nvdaHelperRemote.dll never sees the stubs.
[dev-dependencies.nvda_vbuf]
path = "../nvda_vbuf"
features = ["test_stubs"]

[dependencies.windows-core]
version = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
]
