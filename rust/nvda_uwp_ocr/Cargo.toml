[package]
name = "nvda_uwp_ocr"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib`: this crate is now a pure-Rust dependency of `nvda_python`, which
# exposes it to Python via PyO3 (nvdaRust.uwp_ocr). It used to be a `staticlib`
# linked into nvdaHelperLocalWin10.dll via a C ABI (uwpOcr_*), driven from
# uwpOcr.py by ctypes; that DLL is gone and the seam is now the PyO3 wrapper.
crate-type = ["rlib"]

[dependencies.windows-core]
version = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    # WinRT namespaces used by the OCR engine.
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Data_Json",
    # IBufferByteAccess (raw access to a WinRT IBuffer) + BSTR support.
    "Win32_System_WinRT",
    "Win32_Foundation",
]
